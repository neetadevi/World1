<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Redirecting | Digital Finance</title>
    <script>
      (function() {
        var p = window.location.pathname;
        var search = window.location.search || '';
        var hash = window.location.hash || '';
        var m = p.match(/^\/([^\/]+)/);
        var isGh = window.location.hostname.endsWith('github.io') && m;
        var prefix = isGh ? ('/' + m[1] + '/') : '/';
        var pLower = p.toLowerCase();

        if (pLower.indexOf('/register') !== -1) {
          window.location.replace(prefix + 'dashboard.html?mode=register' + (search ? '&' + search.substring(1) : '') + hash);
        } else if (pLower.indexOf('/login') !== -1) {
          window.location.replace(prefix + 'dashboard.html?mode=login' + (search ? '&' + search.substring(1) : '') + hash);
        } else if (pLower.indexOf('/dashboard') !== -1) {
          window.location.replace(prefix + 'dashboard.html' + search + hash);
        } else {
          window.location.replace(prefix + 'index.html');
        }
      })();
    </script>
  </head>
  <body style="background:#080f20;color:#e6bd37;font-family:sans-serif;text-align:center;padding:50px">
    <h2>Redirecting to Digital Finance...</h2>
  </body>
</html>
